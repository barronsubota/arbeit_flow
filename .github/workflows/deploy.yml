name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - name: Set GitHub Pages base path
        shell: bash
        env:
          BASE_PATH_OVERRIDE: ${{ vars.VITE_BASE_PATH }}
        run: |
          if [[ -n "$BASE_PATH_OVERRIDE" ]]; then
            base_path="$BASE_PATH_OVERRIDE"
          else
            repository="${GITHUB_REPOSITORY#*/}"
            if [[ "$repository" == *.github.io ]]; then
              base_path="/"
            else
              base_path="/$repository/"
            fi
          fi
          echo "VITE_BASE_PATH=$base_path" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
